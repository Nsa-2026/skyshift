[project]
name = "skyshift-pipeline"
version = "0.1.0"
description = "SkyShift hunt-zone pipeline: photo lists, dots, known asteroids, movers, recall, suspects."
requires-python = ">=3.12"
dependencies = [
    "skyshift-core",
    "astroquery>=0.4.10",
    "astropy>=6.1",
    "fsspec>=2024.6",
    "gcsfs>=2024.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyvo>=1.5",
    "requests>=2.31",
    "scipy>=1.11",
    "kete==3.3.0",  # known: MPC orbits (the default known source)
    "astropy-healpix>=1.0",
]

[project.scripts]
skyshift-pipeline = "skyshift_pipeline.cli:main"


[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
skyshift-core = { path = "../core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ../core/src too: on macOS uv can mark the editable .pth files hidden, and Python 3.12 skips them
pythonpath = ["src", "../core/src"]
markers = ["network: needs internet (set SKYSHIFT_NETWORK=1 to run)"]
