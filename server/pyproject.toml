[project]
name = "skyshift-server"
version = "0.1.0"
description = "SkyShift API (Cloud Run) and blink engine: frames, object, gaia, known, resolve (contracts/api.md)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "skyshift-core",
    "astropy>=6.1",
    "astroquery>=0.4.10",
    "fastapi>=0.115",
    "google-cloud-storage>=2.18",
    "httpx>=0.27",
    "numpy>=2.0",
    "pyvo>=1.6",
    "reproject>=0.14",
    "requests>=2.32",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
skyshift-core = { path = "../core", editable = true }

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: needs internet (set SKYSHIFT_NETWORK=1 to run)"]
